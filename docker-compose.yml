services:
  tracker:
    image: adb-less-plane-tracker-tracker:latest
    container_name: adb-less-plane-tracker-tracker
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./recordings:/app/recordings
    environment:
      - TRACKER_CONFIG=/app/config.yaml
    networks:
      - internal

  web:
    image: adb-less-plane-tracker:latest
    container_name: adb-less-plane-tracker
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./recordings:/app/recordings
    environment:
      - TRACKER_CONFIG=/app/config.yaml
    networks:
      - internal
      - praktor-net

networks:
  internal:
  praktor-net:
    external: true
    name: praktor-net
