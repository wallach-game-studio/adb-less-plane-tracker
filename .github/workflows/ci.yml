name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build & test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity-check imports
        run: python3 -m compileall tracker web

      - name: Build tracker image
        run: |
          docker build \
            -f tracker/Dockerfile \
            -t adb-less-plane-tracker-tracker:${{ github.sha }} \
            -t adb-less-plane-tracker-tracker:latest \
            .

      - name: Build web image
        run: |
          docker build \
            -f web/Dockerfile \
            -t adb-less-plane-tracker:${{ github.sha }} \
            -t adb-less-plane-tracker:latest \
            .

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          docker compose -p adb-less-plane-tracker up -d --force-recreate
