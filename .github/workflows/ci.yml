name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sanity-check imports
        run: python -m compileall tracker web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build tracker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tracker/Dockerfile
          push: false
          tags: aircraft-tracker-tracker:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: aircraft-tracker-web:ci

